<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Logs Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 { color: #333; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #6B4EFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
        .login-box button:hover { background: #5a3fd4; }
        #loginError { color: #d32f2f; margin-top: 15px; min-height: 20px; }

        #dashboardSection { display: none; padding: 20px; }
        .header {
            background: #6B4EFF;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; }
        .disconnect-btn {
            background: white;
            color: #6B4EFF;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #6B4EFF; }
        .stat-card .label { font-size: 12px; color: #666; margin-top: 5px; text-transform: uppercase; }
        
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters input {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .filters button {
            padding: 10px 20px;
            background: #6B4EFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .logs-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logs-table table { width: 100%; border-collapse: collapse; }
        .logs-table th {
            background: #f8f9fa;
            padding: 14px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: 600;
        }
        .logs-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .logs-table tr:hover { background: #f8f9fa; }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-debug { background: #e3f2fd; color: #1976d2; }
        .badge-info { background: #e8f5e9; color: #388e3c; }
        .badge-warning { background: #fff3e0; color: #f57c00; }
        .badge-error { background: #ffebee; color: #d32f2f; }
        .badge-fatal { background: #f3e5f5; color: #7b1fa2; }
        
        .export-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 28px;
            background: #00C853;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,200,83,0.4);
        }
        
        .loading { text-align: center; padding: 60px; color: #666; font-size: 16px; }
        .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginSection">
        <div class="login-box">
            <h2>Connexion EduConnect</h2>
            <p>Entrez vos identifiants Supabase</p>
            <input type="text" id="supabaseUrl" placeholder="URL Supabase">
            <input type="password" id="supabaseKey" placeholder="Clé Anon Publique">
            <button onclick="connect()">Se connecter</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection">
        <div class="header">
            <div>
                <h1>Logs Dashboard</h1>
                <p style="opacity: 0.8; margin-top: 5px;">Monitoring en temps reel</p>
            </div>
            <button class="disconnect-btn" onclick="disconnect()">Deconnexion</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalLogs">0</div>
                <div class="label">Total Logs</div>
            </div>
            <div class="stat-card">
                <div class="number" id="errorCount">0</div>
                <div class="label">Erreurs</div>
            </div>
            <div class="stat-card">
                <div class="number" id="apiCount">0</div>
                <div class="label">Appels API</div>
            </div>
            <div class="stat-card">
                <div class="number" id="authCount">0</div>
                <div class="label">Authentifications</div>
            </div>
        </div>

        <div class="filters">
            <select id="filterLevel">
                <option value="">Tous les niveaux</option>
                <option value="debug">Debug</option>
                <option value="info">Info</option>
                <option value="warning">Warning</option>
                <option value="error">Error</option>
                <option value="fatal">Fatal</option>
            </select>
            <select id="filterCategory">
                <option value="">Toutes les categories</option>
                <option value="auth">Auth</option>
                <option value="api">API</option>
                <option value="bloc">BLoC</option>
                <option value="business">Business</option>
                <option value="analytics">Analytics</option>
            </select>
            <input type="datetime-local" id="filterDateFrom">
            <input type="datetime-local" id="filterDateTo">
            <button onclick="loadLogs()">Filtrer</button>
            <button onclick="refreshLogs()" style="background: #00C853;">Actualiser</button>
        </div>

        <div id="errorContainer"></div>

        <div class="logs-table">
            <table>
                <thead>
                    <tr>
                        <th>Niveau</th>
                        <th>Categorie</th>
                        <th>Message</th>
                        <th>Utilisateur</th>
                        <th>Role</th>
                        <th>Ecran</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="logsBody">
                    <tr><td colspan="7" class="loading">Chargement...</td></tr>
                </tbody>
            </table>
        </div>

        <button class="export-btn" onclick="exportCSV()">Exporter CSV</button>
    </div>

    <script>
        let supabase = null;
        let currentLogs = [];

        window.onload = function() {
            const savedUrl = localStorage.getItem('supabase_url');
            const savedKey = localStorage.getItem('supabase_key');
            if (savedUrl && savedKey) {
                document.getElementById('supabaseUrl').value = savedUrl;
                document.getElementById('supabaseKey').value = savedKey;
                connect();
            }
        };

        function connect() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '';

            if (!url || !key) {
                errorDiv.textContent = 'Veuillez remplir les deux champs';
                return;
            }

            try {
                supabase = window.supabase.createClient(url, key);
                localStorage.setItem('supabase_url', url);
                localStorage.setItem('supabase_key', key);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadLogs();
            } catch (err) {
                errorDiv.textContent = 'Erreur: ' + err.message;
            }
        }

        function disconnect() {
            localStorage.removeItem('supabase_url');
            localStorage.removeItem('supabase_key');
            supabase = null;
            location.reload();
        }

        async function loadLogs() {
            if (!supabase) return;
            
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Chargement...</td></tr>';

            const level = document.getElementById('filterLevel').value;
            const category = document.getElementById('filterCategory').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;

            let query = supabase.from('app_logs').select('*').order('created_at', { ascending: false }).limit(500);
            if (level) query = query.eq('level', level);
            if (category) query = query.eq('category', category);
            if (dateFrom) query = query.gte('created_at', dateFrom);
            if (dateTo) query = query.lte('created_at', dateTo);

            try {
                const { data, error } = await query;
                if (error) throw error;
                currentLogs = data || [];
                displayLogs(currentLogs);
                updateStats(currentLogs);
                hideError();
            } catch (err) {
                showError('Erreur: ' + err.message);
            }
        }

        function displayLogs(logs) {
            const tbody = document.getElementById('logsBody');
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">Aucun log trouve</td></tr>';
                return;
            }
            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td><span class="badge badge-${log.level}">${log.level.toUpperCase()}</span></td>
                    <td>${log.category}</td>
                    <td>${escapeHtml(log.message)}</td>
                    <td>${log.phone || 'N/A'}</td>
                    <td>${log.user_role || 'N/A'}</td>
                    <td>${log.screen_name || 'N/A'}</td>
                    <td>${new Date(log.created_at).toLocaleString('fr-FR')}</td>
                </tr>
            `).join('');
        }

        function updateStats(logs) {
            document.getElementById('totalLogs').textContent = logs.length;
            document.getElementById('errorCount').textContent = logs.filter(l => l.level === 'error' || l.level === 'fatal').length;
            document.getElementById('apiCount').textContent = logs.filter(l => l.category === 'api').length;
            document.getElementById('authCount').textContent = logs.filter(l => l.category === 'auth').length;
        }

        function exportCSV() {
            if (currentLogs.length === 0) {
                alert('Aucun log a exporter');
                return;
            }
            const headers = ['Niveau', 'Categorie', 'Message', 'Utilisateur', 'Role', 'Telephone', 'Ecran', 'Date'];
            const rows = currentLogs.map(log => [
                log.level, log.category, log.message, log.user_id || '', log.user_role || '',
                log.phone || '', log.screen_name || '', log.created_at
            ]);
            const csv = [headers, ...rows].map(row => 
                row.map(cell => `"${(cell || '').toString().replace(/"/g, '""')}"`).join(',')
            ).join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `educonnect_logs_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function refreshLogs() { loadLogs(); }
        function showError(msg) { document.getElementById('errorContainer').innerHTML = `<div class="error">${msg}</div>`; }
        function hideError() { document.getElementById('errorContainer').innerHTML = ''; }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        setInterval(() => { if (supabase) refreshLogs(); }, 30000);
    </script>
</body>
</html>
